services:
  - type: web
    name: the-last-mile
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node deploy.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /
    autoDeploy: true
